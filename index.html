<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini SPA Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.min.css " rel="stylesheet">
    <style>
        #about, #services { display: none; } 
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        nav button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
        }
        </style>
</head>
<body>
    <header>
<h1>Welcome to My Mini SPA Project</h1>
</header>
<nav class="navbar">
    <button style="background-color: blue; color: white;" onclick="showSection('home')">home</button >
    <button style="background-color: blue; color: white;" onclick="showSection('about')">About</button>
    <button style="background-color: blue; color: white;" onclick="showSection('services')">Services</button>
</nav>
<main>
<section id="home" class="container mt-4">
<h2 style="color:blue; ">Home</h2>
<p>Welcome to my Mini SPA website</p>
</section>
<section id="about" class="container mt-4">
    <h2>About</h2>
    <p>This website is my Mini SPA project for Web Technologies.</p>
    </section>
    <section id="services" class="container mt-4">
        <h2>Our Services</h2>
        <p>We offer web design, web development, and technical support.</p>
        </section>
    </main>
    <footer>
        <p>© 2026 My Mini SPA Project. All rights reserved.</p>
        </footer class="container mt-4">
         <script>
            function showSection(sectionId) { 
            
                document.querySelectorAll("section").forEach((section) => {
                    section.style.display = "none";
                });
                document.getElementById(sectionId).style.display = "block";
            }
            
            </script>
        
</body>
</html>
